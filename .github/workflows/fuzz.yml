name: Fuzz

on:
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  malformed-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:fuzz
