<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>browser-image-metadata Web Worker example</title>
  </head>
  <body>
    <h1>Parse a local image in a Web Worker</h1>
    <input id="image" type="file" accept="image/*" />
    <pre id="output">Choose an image…</pre>
    <script type="module">
      import { createMetadataWorkerClient } from "../../dist/worker.js";
      const worker = new Worker("./worker.js", { type: "module" });
      const client = createMetadataWorkerClient(worker);
      const output = document.querySelector("#output");
      document.querySelector("#image").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const result = await client.parse(file);
          output.textContent = JSON.stringify(result, null, 2);
        } catch (error) {
          output.textContent = error instanceof Error ? error.message : String(error);
        }
      });
    </script>
  </body>
</html>
